<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squishy Block</title>
<meta name="description" content="Squishy Block, a cozy block puzzle game by Veldenix for Android and iOS.">
<style>
:root { --bg:#fff6f3; --card:#ffffff; --ink:#3d2a45; --soft:#6f5a78; --accent:#b0368a; --line:#f1d9e4; }
@media (prefers-color-scheme: dark) { :root { --bg:#1d1620; --card:#271e2b; --ink:#f3e8f2; --soft:#c9b5c8; --accent:#f08cc8; --line:#3c2f41; } }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
main { max-width:560px; margin:0 auto; padding:56px 16px; text-align:center; }
.card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:32px 24px; }
h1 { color:var(--accent); margin:0 0 8px; font-size:2rem; }
p { color:var(--soft); }
a { color:var(--accent); font-weight:600; }
</style>
</head>
<body>
<main>
<div class="card">
<h1>Squishy Block</h1>
<p>A cozy block puzzle game by Veldenix, for Android and iOS.</p>
<p><a href="privacy-policy.html">Privacy Policy</a></p>
<p>Contact: <a href="mailto:vgame@veldenix.com">vgame@veldenix.com</a></p>
</div>
</main>
</body>
</html>
